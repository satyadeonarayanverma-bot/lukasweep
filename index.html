<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAT WELL • STAY HYDRATED • TAKE MEDS ON TIME • YOUR ADI IS ALWAYS HERE FOR YOU TO HELP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@600;700&family=Outfit:wght@800;900&family=Rubik:wght@800;900&family=Sacramento&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Large Centered Photo Vignette Watermark Layer -->
  <div class="photo-watermark-bg">
    <img src="WhatsApp Image 2026-07-26 at 17.02.03.jpeg" alt="Watermark Photo" class="photo-watermark-img">
  </div>

  <!-- Fixed Low Opacity Watermark Layer (Text + Mini Photo Tiles) -->
  <div id="watermark-container" class="watermark-container"></div>

  <!-- Main Stage -->
  <main class="spam-stage">
    <div id="spam-track" class="spam-track"></div>
  </main>

  <!-- Self Care Floating Action Button -->
  <button id="care-btn" class="care-btn">
    <span class="btn-heart">💖</span>
    <span class="btn-text">Click here if you took care of yourself today</span>
    <span class="btn-heart">💖</span>
  </button>

  <!-- Cute Love Message Popup Modal -->
  <div id="love-modal" class="love-modal-overlay">
    <div class="love-modal-card">
      <button id="close-modal-btn" class="close-modal-btn">&times;</button>
      <div class="modal-heart-badge">🌸 💖 🌸</div>
      <p class="love-message">
        Mwahh baby! I love you so much, thank you so much for taking care of yourself. You are the absolute best! I am so in love with you, I am so proud of you, you are really doing phenomenal!
      </p>
      <div class="modal-footer-sparkle">✨ 💖 ✨</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
